<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .chatbot-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 400px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            background-color: #007bff;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 10px;
            justify-content: space-between;
        }
        .logo {
            width: 75px;
            height: 70px;
            margin-right: 10px;
        }
        .logo-right {
            width: 60px;
            height: 60px;
        }
        .bot-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .chat-screen {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column-reverse;
        }
        .message-row {
            display: flex;
            margin-bottom: 10px;
            flex-direction: column-reverse;
        }
        .user-message {
            background-color: #007bff;
            color: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 70%;
            text-align: right;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #f0f0f0;
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 70%;
            text-align: left;
            align-self: flex-start;
        }
        .message-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .message-info.bot {
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            border-top: 1px solid #ccc;
            background-color: #fff;
        }
        .input-field {
            flex: 1;
            border: none;
            padding: 8px;
            margin-right: 10px;
            border-radius: 20px;
            outline: none;
        }
        .send-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            outline: none;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #f0f0f0;
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="header">
            <img src="{{ url_for('static', filename='Getbot.png') }}" alt="Logo" class="logo">
            <div class="bot-name">GETBOT</div>
            <img src="{{ url_for('static', filename='ubbg.png') }}" alt="Logo" class="logo logo-right">
        </div>
        <div class="chat-screen" id="chat-screen">
            <!-- Chat messages will be dynamically added here -->
        </div>
        <div class="input-container">
            <input type="text" class="input-field" id="user-input" placeholder="Type your message...">
            <button class="send-btn" onclick="sendMessage()">Kirim</button>
        </div>
        <footer>
            <p>&copy; 2024 GetBot by [Kelompok 4: Zaki, Arthur, Anggi, Nava, Suci, dan Haekal]</p>
        </footer>
    </div>

    <script>
        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            var user_input = document.getElementById('user-input').value;
            if (user_input.trim() === '') {
                return; // Jangan kirim pesan kosong
            }
            document.getElementById('user-input').value = '';

            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 'user_input': user_input }),
            })
            .then(response => response.json())
            .then(data => {
                addUserMessage(user_input);
                addBotMessage(data.bot_response);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function addBotMessage(message) {
            var chatScreen = document.getElementById('chat-screen');
            var messageRow = document.createElement('div');
            messageRow.className = 'message-row';
            var botMessageElement = document.createElement('div');
            botMessageElement.className = 'bot-message';
            botMessageElement.textContent = message;
            var messageInfo = document.createElement('div');
            messageInfo.className = 'message-info bot';
            messageInfo.textContent = 'GetBot';
            messageRow.appendChild(botMessageElement);
            messageRow.appendChild(messageInfo);
            chatScreen.insertBefore(messageRow, chatScreen.firstChild);
            
            chatScreen.scrollTop = chatScreen.scrollHeight;
        }

        function addUserMessage(message) {
            var chatScreen = document.getElementById('chat-screen');
            var messageRow = document.createElement('div');
            messageRow.className = 'message-row';
            var userMessageElement = document.createElement('div');
            userMessageElement.className = 'user-message';
            userMessageElement.textContent = message;
            var messageInfo = document.createElement('div');
            messageInfo.className = 'message-info';
            messageInfo.textContent = 'Anda';
            messageRow.appendChild(userMessageElement);
            messageRow.appendChild(messageInfo);
            chatScreen.insertBefore(messageRow, chatScreen.firstChild);
            
            chatScreen.scrollTop = chatScreen.scrollHeight;
        }
    </script>
</body>
</html>
